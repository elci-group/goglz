# Goglz Revision Configuration
# This file defines how documents should be revised when using the `goglz revise` command

# The overall purpose of document revision
purpose: "Improve document clarity, consistency, and readability across the project"

# The scope of documents to be revised
scope: "All documentation files in the project including README, guides, and technical documentation"

# Writing style guidelines
writing_style:
  tone: "Professional and approachable"
  voice: "Active and direct"
  audience: "Developers and technical users"
  guidelines:
    - "Use active voice instead of passive voice"
    - "Be concise while maintaining completeness"
    - "Avoid jargon unless necessary, then explain it"
    - "Use clear headings and subheadings"
    - "Provide examples for complex concepts"
    - "Maintain consistent terminology throughout"

# Formatting rules for document structure
formatting_rules:
  headings: true
  bullet_points: true
  numbered_lists: true
  code_blocks: true
  max_line_length: 80
  custom_rules:
    - "Use Markdown for all documentation"
    - "Include code examples with syntax highlighting"
    - "Use proper indentation for nested lists"
    - "Separate sections with blank lines"

# Global assets available to all documents
# These files provide context and guidelines for revision
# Uncomment and add actual files that exist in your project
global_assets: []

# Local assets relative to individual documents
# These can be referenced in subdirectories for specific contexts
# Uncomment and add actual files that exist in your project
local_assets: []
